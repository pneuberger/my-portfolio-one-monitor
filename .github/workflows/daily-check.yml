name: Daily check

on:
  schedule:
    - cron: "15 6 * * 2-6"   # Tue-Sat 06:15 UTC (07:15 Berlin in winter), uses the previous US close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Check regime and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          PORTFOLIO_VALUE_EUR: ${{ secrets.PORTFOLIO_VALUE_EUR }}
          MONTHLY_CONTRIBUTION_EUR: ${{ secrets.MONTHLY_CONTRIBUTION_EUR }}
        run: python -m src.check

      - name: Commit changes
        if: always()   # keep fetched history even if a notification failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data.json docs/chart.png
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: $(date -u +%Y-%m-%d)"
            git push
          fi
